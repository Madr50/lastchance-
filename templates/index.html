<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>متجر ريبر X — حسابات X النادرة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/shop.css"/>
</head>
<body>

<!-- Ambient background orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- ── Header ──────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">𝕏</div>
      <div class="logo-text">
        <span class="logo-name">ريبر X</span>
        <span class="logo-tagline">RARE ACCOUNTS</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="searchToggle" title="بحث" aria-label="بحث">🔍</button>
    </div>
  </div>
  <!-- Search bar -->
  <div class="search-bar" id="searchBar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="search" id="searchInput"
        placeholder="ابحث عن حساب..." autocomplete="off"
        inputmode="search"
      />
      <button class="search-clear hidden" id="searchClear" aria-label="مسح البحث">✕</button>
    </div>
  </div>
</header>

<!-- ── Filters ─────────────────────────────────────── -->
<div class="filters">
  <div class="pills-track" id="pillsTrack">
    <button class="pill active" data-year="all">
      الكل <span class="pill-count">0</span>
    </button>
    <!-- Year pills injected by JS -->
  </div>
</div>

<!-- ── Stats bar ───────────────────────────────────── -->
<div class="stats-bar hidden" id="statsBar">
  <span class="stats-dot"></span>
  <span id="statsText"></span>
</div>

<!-- ── Main content ────────────────────────────────── -->
<main class="content">
  <!-- Skeleton loading -->
  <div id="loadingBox"></div>

  <!-- Accounts grid -->
  <div class="grid hidden" id="accountsGrid"></div>

  <!-- Empty state -->
  <div class="empty-state hidden" id="emptyBox">
    <div class="empty-icon">🕵️</div>
    <div class="empty-title">لا توجد نتائج</div>
    <div class="empty-sub">جرّب تغيير الفلتر أو مصطلح البحث</div>
  </div>
</main>

<!-- ── Bottom Sheet Overlay ─────────────────────────── -->
<div class="sheet-overlay" id="overlay"></div>

<!-- ── Bottom Sheet ────────────────────────────────── -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<!-- ── Toast ───────────────────────────────────────── -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/js/shop.js"></script>
</body>
</html>
